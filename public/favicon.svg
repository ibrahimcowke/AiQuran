<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Emerald Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="35%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Imperial Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Deep Gold Gradient -->
    <linearGradient id="deepGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Book Page Cream Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF5E6" />
      <stop offset="50%" stop-color="#FFFDF8" />
      <stop offset="100%" stop-color="#F3EAD3" />
    </linearGradient>

    <!-- AI Cyan/Mint Sparkle Gradient -->
    <linearGradient id="aiSparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle with Shadow -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="22" y="22" width="468" height="468" rx="102" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85" />
  <rect x="34" y="34" width="444" height="444" rx="90" fill="none" stroke="#34D399" stroke-width="2" opacity="0.3" stroke-dasharray="8 6" />

  <!-- Background Islamic Arch / Mihrab Outline -->
  <path d="M156 410 V 230 C 156 160, 256 110, 256 110 C 256 110, 356 160, 356 230 V 410" 
        fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.25" />

  <!-- Radiance Aura behind the Star -->
  <circle cx="256" cy="180" r="85" fill="#F59E0B" opacity="0.12" filter="url(#goldGlow)" />

  <!-- Gilded 8-Pointed Star (Rub el Hizb ۞ / AI Intelligent Crown) -->
  <g transform="translate(256, 180)" filter="url(#goldGlow)">
    <!-- First Square -->
    <rect x="-38" y="-38" width="76" height="76" rx="9" fill="url(#goldGrad)" />
    <!-- Rotated 45-degree Square -->
    <rect x="-38" y="-38" width="76" height="76" rx="9" fill="url(#goldGrad)" transform="rotate(45)" />
    <!-- Inner Central Core -->
    <circle cx="0" cy="0" r="24" fill="#064E3B" />
    <circle cx="0" cy="0" r="19" fill="url(#goldGrad)" opacity="0.4" />
    <!-- AI Intelligence Diamond Sparkle -->
    <path d="M0 -15 Q 0 0 -15 0 Q 0 0 0 15 Q 0 0 15 0 Q 0 0 0 -15 Z" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="3.5" fill="#047857" />
  </g>

  <!-- Open Holy Quran Book (المصحف الشريف) -->
  <g id="holy-quran" transform="translate(0, 35)">
    <!-- Book Backing Shadow / Cover -->
    <path d="M96 345 C 160 330, 235 348, 256 362 C 277 348, 352 330, 416 345 V 360 C 352 345, 277 362, 256 376 C 235 362, 160 345, 96 360 Z" 
          fill="url(#deepGoldGrad)" />

    <!-- Left Open Page -->
    <path d="M102 245 C 165 228, 236 242, 254 262 L 254 366 C 236 346, 165 332, 102 348 Z" 
          fill="url(#pageGrad)" stroke="#D4AF37" stroke-width="2" />

    <!-- Right Open Page -->
    <path d="M410 245 C 347 228, 276 242, 258 262 L 258 366 C 276 346, 347 332, 410 348 Z" 
          fill="url(#pageGrad)" stroke="#D4AF37" stroke-width="2" />

    <!-- Left Page Texture / Calligraphy Lines -->
    <g opacity="0.35" stroke="#78350F" stroke-width="2.5" stroke-linecap="round">
      <line x1="126" y1="272" x2="232" y2="280" />
      <line x1="126" y1="292" x2="232" y2="300" />
      <line x1="126" y1="312" x2="232" y2="320" />
      <line x1="140" y1="332" x2="218" y2="338" />
    </g>

    <!-- Right Page Texture / Calligraphy Lines -->
    <g opacity="0.35" stroke="#78350F" stroke-width="2.5" stroke-linecap="round">
      <line x1="280" y1="280" x2="386" y2="272" />
      <line x1="280" y1="300" x2="386" y2="292" />
      <line x1="280" y1="320" x2="386" y2="312" />
      <line x1="294" y1="338" x2="372" y2="332" />
    </g>

    <!-- Page Gilded Corner Flourishes -->
    <path d="M112 258 L 126 255 L 126 269" fill="none" stroke="#D97706" stroke-width="2" opacity="0.7" />
    <path d="M400 258 L 386 255 L 386 269" fill="none" stroke="#D97706" stroke-width="2" opacity="0.7" />

    <!-- Golden Spine and Bookmark Ribbon -->
    <path d="M253 260 H 259 V 390 H 253 Z" fill="url(#goldGrad)" />
    <!-- Gilded Silk Ribbon Bookmark hanging below -->
    <path d="M251 366 L 251 422 L 256 414 L 261 422 L 261 366 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />
  </g>

  <!-- Mini AI Radiance Stars -->
  <path d="M120 150 Q 120 160 110 160 Q 120 160 120 170 Q 120 160 130 160 Q 120 160 120 150 Z" fill="#FDE68A" opacity="0.8" />
  <path d="M392 150 Q 392 160 382 160 Q 392 160 392 170 Q 392 160 402 160 Q 392 160 392 150 Z" fill="#FDE68A" opacity="0.8" />
  <circle cx="160" cy="118" r="3" fill="#A7F3D0" opacity="0.7" />
  <circle cx="352" cy="118" r="3" fill="#A7F3D0" opacity="0.7" />
</svg>
